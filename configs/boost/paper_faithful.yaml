boost:
  mode: paper_faithful
  # All values confirmed from arXiv:2511.22874 PDF (Section 3 Methods), 2026-06-13.
  timestep_fs: 0.25          # confirmed: PDF p.7, 0.25 fs
  biased_steps: 2000         # confirmed: PDF p.7, 2000 steps = 500 fs
  unbiased_steps: 2000       # confirmed: PDF p.7, "alternating ... every 2000 steps"
  lambda_vdw: 0.60           # confirmed: Eq. 4, "60% of the sum of their vdW radii"
  f2_invA2: 10.0             # confirmed: PDF p.7, 10 Angstrom^-2
  gamma: 1.0                 # confirmed: PDF p.7, value=1.0; unit not stated, using kcal/(mol*step)
  f1_max_form_kcal_mol: 250.0   # confirmed: PDF p.7, 250 kcal/mol
  f1_max_break_kcal_mol: 125.0  # confirmed: PDF p.7, 125 kcal/mol
