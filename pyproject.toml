[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pfpoly"
version = "0.1.0"
description = "Commercial-safe starter for reproducing TDBB-based polymerization workflows"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
plot = [
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
